# 允许自动修复
fix = true
# 允许不安全的修复
unsafe-fixes = true

# Python 版本
target-version = "py38"

# 设置行长度
line-length = 100

# 选择要启用的规则
select = [
    "E",   # pycodestyle 错误
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle 警告
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# 忽略特定规则
ignore = [
    "E501",  # 行太长
]

# 排除特定目录
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist"
]

# import 排序设置
[isort]
known-first-party = ["your_project_name"]
